name = "chatweb"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 部署前先产出 dist/。
# dist/ 不进仓库，所以 Cloudflare 的 Workers Builds 克隆下来是没有它的；
# 而它默认的部署命令就是 `npx wrangler deploy`，不会自己跑构建。
# 把构建挂在这里，本地 `wrangler deploy` 和 CF 云端构建就都能拿到 dist/。
[build]
command = "pnpm build"

# 静态 SPA。dist 由 `pnpm build` 产出。
# not_found_handling 让所有未命中路径回落到 index.html（前端自己路由）。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 用户上传的图片/视频。视频编辑与延长需要一个公网可达的源文件 URL，
# 而 grok2api 的上传端点是 admin-only，所以自建这条通道。
# 建议给这个 bucket 配一条 lifecycle rule，自动删除 7 天前的对象。
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "chatweb"

[vars]
# —— 服务端密钥模式（可选）——
# Worker 已提供 /__api/config、/__api/auth 和 /__api/proxy/*；
# 当前前端尚未读取预置配置或创建 proxy 后端，填写这些变量只是在服务端准备接口。
UPSTREAM_BASE_URL = ""
UPSTREAM_NAME = ""
# 逗号分隔，由 /__api/config 原样返回。前端尚未接入预置后端；留空不会自动探测。
# 可选值: chat,image,video,tts,stt
UPSTREAM_CAPABILITIES = ""

# —— 联网搜索 ——
# 可选值: auto,exa,bing-rss,duckduckgo,searxng,tavily,serper
SEARCH_PROVIDER = "auto"
# 自建 SearXNG 根地址；非 searxng 时可留空。
SEARCH_BASE_URL = ""
# 整个自动兜底链路的总超时，会限制在 1000–15000ms。
SEARCH_TIMEOUT_MS = "7000"

# —— 上传限制 ——
MAX_UPLOAD_BYTES = "104857600"
MEDIA_CACHE_SECONDS = "604800"

# —— 需要用 `wrangler secret put` 设置的，不要写在这里 ——
#   UPSTREAM_API_KEY   服务端持有的上游 key
#   ACCESS_PASSWORD    访问口令
#   TOKEN_SECRET       签发访问 token 用的 HMAC 密钥（随便一串长随机字符）
#   SEARCH_API_KEY     Tavily 或 Serper key；使用免费搜索时不用设置
